# Release Drafter Configuration
# Maps labels to changelog categories

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'type:feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'type:fix'
  - title: '📚 Documentation'
    labels:
      - 'type:docs'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: ''

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'type:feature'
  patch:
    labels:
      - 'type:fix'
      - 'type:docs'
  default: patch

template: |
  ## Changes

  $CHANGES
